name: Execution core checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  execution-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec vitest run tests/execution-core.test.ts tests/execution-integration.test.ts
      - run: pnpm typecheck
